# The Paper API and Towny builds to compile against. Match them to the server you run the plugin on.
#
# Paper 26.x versions look like <mc>.build.<n>-<status>, e.g. 26.3.build.242-stable (see jd.papermc.io/paper/26.3).
# Pin a -stable build, ideally the one your server runs (26.3.build.242-stable was the newest seen on 2026-11-16).
# Keep the ".build." part; "26.3.build.+" would take the newest build of any status. ("26.3.0.build.+" matches
# nothing: 26.3 has no ".0".)
paperVersion=26.3.build.242-stable
# Towny: 0.103.2.7 is the first build that supports Minecraft 26.3. It is a pre-release (see Towny's GitHub
# releases). If it does not resolve from repo.glaremasters.me, use the newest version that does (0.103.2.0 is the
# newest full release the Towny wiki lists); the API calls this plugin uses are the same in it.
townyVersion=0.103.2.7
